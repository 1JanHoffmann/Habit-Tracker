document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 (anchored on --vp-blue @ 500) ---- */\n  --blue-50:  #eef5f8;\n  --blue-100: #d7e7f0;\n  --blue-200: #b3d0de;\n  --blue-300: #8bb6cb;\n  --blue-400: #6aa0ba;\n  --blue-500: #4c8ba5;\n  --blue-600: #3e7388;\n  --blue-700: #335d6e;\n  --blue-800: #284856;\n  --blue-900: #1d343e;\n\n  /* ---- Neutral ramp (warm-tinted to match beige/ink) ---- */\n  --neutral-0:   #ffffff;\n  --neutral-25:  #fbfbf9;\n  --neutral-50:  #f7f7f4;\n  --neutral-100: #f2f2f2;\n  --neutral-200: #e6e6e3;\n  --neutral-300: #d4d4d0;\n  --neutral-400: #b0b0aa;\n  --neutral-500: #888883;\n  --neutral-600: #65655f;\n  --neutral-700: #4b483e;\n  --neutral-800: #353530;\n  --neutral-900: #2b2b2b;\n\n  /* ---- Coral / amber / red support ---- */\n  --coral-100: #fde8e1;\n  --coral-300: #f7c4b3;\n  --coral-500: #f2a288;\n  --coral-700: #cf6e4f;\n  --amber-100: #f6ead6;\n  --amber-500: #bd7632; /* bronze */\n  --amber-700: #8f5722;\n  --red-100:   #fbe2dd;\n  --red-500:   #d65a45;\n  --red-700:   #a83c2c;\n\n  /* ============================================================\n     Semantic aliases — reference these in product UI\n     ============================================================ */\n  /* Surfaces */\n  --surface-page:       var(--neutral-50);\n  --surface-card:       var(--neutral-0);\n  --surface-raised:     var(--neutral-0);\n  --surface-sunken:     var(--neutral-100);\n  --surface-warm:       var(--vp-beige);\n  --surface-brand:      var(--green-500);\n  --surface-brand-soft: var(--green-50);\n  --surface-info-soft:  var(--blue-50);\n  --surface-inverse:    var(--neutral-900);\n\n  /* Text */\n  --text-strong:    var(--neutral-900);\n  --text-body:      var(--neutral-800);\n  --text-muted:     var(--neutral-600);\n  --text-subtle:    var(--neutral-500);\n  --text-on-brand:  #ffffff;\n  --text-on-dark:   var(--neutral-50);\n  --text-link:      var(--blue-600);\n  --text-brand:     var(--green-700);\n\n  /* Borders */\n  --border-subtle:  var(--neutral-200);\n  --border-default: var(--neutral-300);\n  --border-strong:  var(--neutral-400);\n  --border-brand:   var(--green-500);\n  --border-focus:   var(--blue-500);\n\n  /* Interactive — brand (primary action) */\n  --action-bg:         var(--green-500);\n  --action-bg-hover:   var(--green-600);\n  --action-bg-active:  var(--green-700);\n  --action-fg:         #ffffff;\n\n  /* Interactive — accent (secondary action) */\n  --accent-bg:         var(--blue-500);\n  --accent-bg-hover:   var(--blue-600);\n  --accent-bg-active:  var(--blue-700);\n\n  /* Status */\n  --status-success-fg:  var(--green-700);\n  --status-success-bg:  var(--green-50);\n  --status-info-fg:     var(--blue-700);\n  --status-info-bg:     var(--blue-50);\n  --status-warning-fg:  var(--amber-700);\n  --status-warning-bg:  var(--amber-100);\n  --status-danger-fg:   var(--red-700);\n  --status-danger-bg:   var(--red-100);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(76, 139, 165, 0.35);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Verbund Pflegehilfe — Typography Tokens\n   Lato is the brand UI typeface (Light/Regular/Bold/Black).\n   Verdana & Tahoma are the approved office-document fallbacks.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-sans: 'Lato', 'Verdana', 'Tahoma', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-office: 'Verdana', 'Tahoma', system-ui, sans-serif; /* official docs / fallback */\n  --font-mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace;\n\n  /* Weights */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-bold:    700;\n  --weight-black:   900;\n\n  /* Type scale (1.250 major-third, 16px base) */\n  --text-2xs: 11px;\n  --text-xs:  12px;\n  --text-sm:  14px;\n  --text-md:  16px;  /* body default */\n  --text-lg:  18px;\n  --text-xl:  20px;\n  --text-2xl: 25px;\n  --text-3xl: 31px;\n  --text-4xl: 39px;\n  --text-5xl: 49px;\n  --text-6xl: 61px;\n\n  /* Line heights */\n  --leading-tight:   1.15;\n  --leading-snug:    1.3;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n  --tracking-caps:   0.06em;\n\n  /* ---- Semantic type roles ---- */\n  --type-display-size:   var(--text-5xl);\n  --type-display-weight: var(--weight-black);\n  --type-display-leading: var(--leading-tight);\n\n  --type-h1-size:   var(--text-4xl);\n  --type-h1-weight: var(--weight-bold);\n  --type-h2-size:   var(--text-3xl);\n  --type-h2-weight: var(--weight-bold);\n  --type-h3-size:   var(--text-2xl);\n  --type-h3-weight: var(--weight-bold);\n  --type-h4-size:   var(--text-xl);\n  --type-h4-weight: var(--weight-bold);\n\n  --type-body-size:   var(--text-md);\n  --type-body-weight: var(--weight-regular);\n  --type-body-leading: var(--leading-normal);\n\n  --type-small-size:  var(--text-sm);\n  --type-caption-size: var(--text-xs);\n  --type-overline-size: var(--text-xs);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Verbund Pflegehilfe — Spacing & Layout Tokens\n   4px base unit. Brand layout guidance: 12-column grid,\n   5–10% outer safety margin, generous breathing room.\n   ============================================================ */\n:root {\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n\n  /* Layout */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n  --grid-columns:  12; /* @kind other */\n  --grid-gutter:   24px;\n  --page-margin:   clamp(16px, 5vw, 80px); /* 5–10% brand safety zone */\n\n  /* Component sizing */\n  --control-height-sm: 32px;\n  --control-height-md: 40px;\n  --control-height-lg: 48px;\n  --sidebar-width:     264px;\n  --topbar-height:     64px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Verbund Pflegehilfe — Radii, Shadows & Motion Tokens\n   Soft, friendly, rounded corners. Light diffuse shadows that\n   keep the airy, approachable feel called for in the brand\n   imagery guidance. No harsh contrast.\n   ============================================================ */\n:root {\n  /* Corner radii — soft & rounded, per brand \"runde Ecken\" */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   14px;\n  --radius-xl:   20px;\n  --radius-2xl:  28px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Shadows — soft, warm-neutral, low contrast */\n  --shadow-xs:  0 1px 2px rgba(43, 43, 43, 0.06);\n  --shadow-sm:  0 1px 3px rgba(43, 43, 43, 0.08), 0 1px 2px rgba(43, 43, 43, 0.04);\n  --shadow-md:  0 4px 12px rgba(43, 43, 43, 0.08), 0 2px 4px rgba(43, 43, 43, 0.04);\n  --shadow-lg:  0 12px 28px rgba(43, 43, 43, 0.10), 0 4px 10px rgba(43, 43, 43, 0.05);\n  --shadow-xl:  0 24px 56px rgba(43, 43, 43, 0.14), 0 8px 18px rgba(43, 43, 43, 0.06);\n\n  /* Brand-tinted glow (for green/blue emphasis) */\n  --shadow-brand: 0 8px 24px rgba(152, 196, 76, 0.25);\n  --shadow-focus: 0 0 0 3px rgba(76, 139, 165, 0.35);\n\n  /* Motion — gentle, no bounce; calm & reassuring */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1); /* @kind other */\n  --duration-fast:   120ms; /* @kind other */\n  --duration-normal: 200ms; /* @kind other */\n  --duration-slow:   320ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Verbund Pflegehilfe — Base element styles & utilities\n   Minimal, opt-in resets layered on the token system.\n   ============================================================ */\n:root {\n  color-scheme: light;\n}\n\nbody.vp {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--type-body-size);\n  line-height: var(--type-body-leading);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Heading helpers (class-based; do not restyle bare tags globally) */\n.vp-display { font-size: var(--type-display-size); font-weight: var(--type-display-weight); line-height: var(--type-display-leading); letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 0; }\n.vp-h1 { font-size: var(--type-h1-size); font-weight: var(--type-h1-weight); line-height: var(--leading-tight); color: var(--text-strong); margin: 0; }\n.vp-h2 { font-size: var(--type-h2-size); font-weight: var(--type-h2-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-h3 { font-size: var(--type-h3-size); font-weight: var(--type-h3-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-h4 { font-size: var(--type-h4-size); font-weight: var(--type-h4-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-body { font-size: var(--type-body-size); line-height: var(--type-body-leading); color: var(--text-body); }\n.vp-small { font-size: var(--type-small-size); color: var(--text-muted); }\n.vp-caption { font-size: var(--type-caption-size); color: var(--text-subtle); }\n.vp-overline { font-size: var(--type-overline-size); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }\n\n.vp-link { color: var(--text-link); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--duration-fast) var(--ease-standard); }\n.vp-link:hover { border-bottom-color: currentColor; }\n<\u002Fstyle>\n  <style>/* ============================================= off2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"ff0a2400-4bbc-4a13-a8f7-9c0502c3210c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Verbund Pflegehilfe — Color Tokens\n   Brand palette from Corporate Design Guidelines (04/2022)\n   ============================================================ */\n:root {\n  /* ---- Brand primaries (verbatim from guidelines) ---- */\n  --vp-green:        #98c44c; /* Pflegehilfe Grün   — primary brand */\n  --vp-green-light:  #c1dc94; /* Pflegehilfe Hellgrün */\n  --vp-blue:         #4c8ba5; /* Pflegehilfe Blau   — secondary brand */\n  --vp-blue-light:   #d7e7f0; /* Pflegehilfe Hellblau */\n  --vp-beige:        #f8f5e1; /* Pflegehilfe Beige  — warm surface */\n  --vp-ink:          #2b2b2b; /* Pflegehilfe Schwarz */\n  --vp-gray:         #f2f2f2; /* Pflegehilfe Grau */\n  --vp-coral:        #f2a288; /* Pflegehilfe Rot — internal / soft accent */\n\n  /* ---- Logo accents (sampled from the brand mark) ---- */\n  --vp-bronze:       #bd7632; /* leaf-mark bronze */\n  --vp-wordmark:     #4b483e; /* warm charcoal of the wordmark */\n\n  /* ---- Green ramp (anchored on --vp-green @ 500) ---- */\n  --green-50:  #f4f9ea;\n  --green-100: #e6f1d2;\n  --green-200: #d3e6b1;\n  --green-300: #c1dc94;\n  --green-400: #aed070;\n  --green-500: #98c44c;\n  --green-600: #7ba63a;\n  --green-700: #5f822e;\n  --green-800: #486322;\n  --green-900: #344718;\n\n  /* ---- Blue ramp (anchored on --vp-blue @ 500) ---- */\n  --blue-50:  #eef5f8;\n  --blue-100: #d7e7f0;\n  --blue-200: #b3d0de;\n  --blue-300: #8bb6cb;\n  --blue-400: #6aa0ba;\n  --blue-500: #4c8ba5;\n  --blue-600: #3e7388;\n  --blue-700: #335d6e;\n  --blue-800: #284856;\n  --blue-900: #1d343e;\n\n  /* ---- Neutral ramp (warm-tinted to match beige/ink) ---- */\n  --neutral-0:   #ffffff;\n  --neutral-25:  #fbfbf9;\n  --neutral-50:  #f7f7f4;\n  --neutral-100: #f2f2f2;\n  --neutral-200: #e6e6e3;\n  --neutral-300: #d4d4d0;\n  --neutral-400: #b0b0aa;\n  --neutral-500: #888883;\n  --neutral-600: #65655f;\n  --neutral-700: #4b483e;\n  --neutral-800: #353530;\n  --neutral-900: #2b2b2b;\n\n  /* ---- Coral / amber / red support ---- */\n  --coral-100: #fde8e1;\n  --coral-300: #f7c4b3;\n  --coral-500: #f2a288;\n  --coral-700: #cf6e4f;\n  --amber-100: #f6ead6;\n  --amber-500: #bd7632; /* bronze */\n  --amber-700: #8f5722;\n  --red-100:   #fbe2dd;\n  --red-500:   #d65a45;\n  --red-700:   #a83c2c;\n\n  /* ============================================================\n     Semantic aliases — reference these in product UI\n     ============================================================ */\n  /* Surfaces */\n  --surface-page:       var(--neutral-50);\n  --surface-card:       var(--neutral-0);\n  --surface-raised:     var(--neutral-0);\n  --surface-sunken:     var(--neutral-100);\n  --surface-warm:       var(--vp-beige);\n  --surface-brand:      var(--green-500);\n  --surface-brand-soft: var(--green-50);\n  --surface-info-soft:  var(--blue-50);\n  --surface-inverse:    var(--neutral-900);\n\n  /* Text */\n  --text-strong:    var(--neutral-900);\n  --text-body:      var(--neutral-800);\n  --text-muted:     var(--neutral-600);\n  --text-subtle:    var(--neutral-500);\n  --text-on-brand:  #ffffff;\n  --text-on-dark:   var(--neutral-50);\n  --text-link:      var(--blue-600);\n  --text-brand:     var(--green-700);\n\n  /* Borders */\n  --border-subtle:  var(--neutral-200);\n  --border-default: var(--neutral-300);\n  --border-strong:  var(--neutral-400);\n  --border-brand:   var(--green-500);\n  --border-focus:   var(--blue-500);\n\n  /* Interactive — brand (primary action) */\n  --action-bg:         var(--green-500);\n  --action-bg-hover:   var(--green-600);\n  --action-bg-active:  var(--green-700);\n  --action-fg:         #ffffff;\n\n  /* Interactive — accent (secondary action) */\n  --accent-bg:         var(--blue-500);\n  --accent-bg-hover:   var(--blue-600);\n  --accent-bg-active:  var(--blue-700);\n\n  /* Status */\n  --status-success-fg:  var(--green-700);\n  --status-success-bg:  var(--green-50);\n  --status-info-fg:     var(--blue-700);\n  --status-info-bg:     var(--blue-50);\n  --status-warning-fg:  var(--amber-700);\n  --status-warning-bg:  var(--amber-100);\n  --status-danger-fg:   var(--red-700);\n  --status-danger-bg:   var(--red-100);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(76, 139, 165, 0.35);\n}\n\n/* ============================================================\n   Verbund Pflegehilfe — Typography Tokens\n   Lato is the brand UI typeface (Light/Regular/Bold/Black).\n   Verdana & Tahoma are the approved office-document fallbacks.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-sans: 'Lato', 'Verdana', 'Tahoma', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-office: 'Verdana', 'Tahoma', system-ui, sans-serif; /* official docs / fallback */\n  --font-mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace;\n\n  /* Weights */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-bold:    700;\n  --weight-black:   900;\n\n  /* Type scale (1.250 major-third, 16px base) */\n  --text-2xs: 11px;\n  --text-xs:  12px;\n  --text-sm:  14px;\n  --text-md:  16px;  /* body default */\n  --text-lg:  18px;\n  --text-xl:  20px;\n  --text-2xl: 25px;\n  --text-3xl: 31px;\n  --text-4xl: 39px;\n  --text-5xl: 49px;\n  --text-6xl: 61px;\n\n  /* Line heights */\n  --leading-tight:   1.15;\n  --leading-snug:    1.3;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n  --tracking-caps:   0.06em;\n\n  /* ---- Semantic type roles ---- */\n  --type-display-size:   var(--text-5xl);\n  --type-display-weight: var(--weight-black);\n  --type-display-leading: var(--leading-tight);\n\n  --type-h1-size:   var(--text-4xl);\n  --type-h1-weight: var(--weight-bold);\n  --type-h2-size:   var(--text-3xl);\n  --type-h2-weight: var(--weight-bold);\n  --type-h3-size:   var(--text-2xl);\n  --type-h3-weight: var(--weight-bold);\n  --type-h4-size:   var(--text-xl);\n  --type-h4-weight: var(--weight-bold);\n\n  --type-body-size:   var(--text-md);\n  --type-body-weight: var(--weight-regular);\n  --type-body-leading: var(--leading-normal);\n\n  --type-small-size:  var(--text-sm);\n  --type-caption-size: var(--text-xs);\n  --type-overline-size: var(--text-xs);\n}\n\n/* ============================================================\n   Verbund Pflegehilfe — Spacing & Layout Tokens\n   4px base unit. Brand layout guidance: 12-column grid,\n   5–10% outer safety margin, generous breathing room.\n   ============================================================ */\n:root {\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n\n  /* Layout */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n  --grid-columns:  12; /* @kind other */\n  --grid-gutter:   24px;\n  --page-margin:   clamp(16px, 5vw, 80px); /* 5–10% brand safety zone */\n\n  /* Component sizing */\n  --control-height-sm: 32px;\n  --control-height-md: 40px;\n  --control-height-lg: 48px;\n  --sidebar-width:     264px;\n  --topbar-height:     64px;\n}\n\n/* ============================================================\n   Verbund Pflegehilfe — Radii, Shadows & Motion Tokens\n   Soft, friendly, rounded corners. Light diffuse shadows that\n   keep the airy, approachable feel called for in the brand\n   imagery guidance. No harsh contrast.\n   ============================================================ */\n:root {\n  /* Corner radii — soft & rounded, per brand \"runde Ecken\" */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   14px;\n  --radius-xl:   20px;\n  --radius-2xl:  28px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Shadows — soft, warm-neutral, low contrast */\n  --shadow-xs:  0 1px 2px rgba(43, 43, 43, 0.06);\n  --shadow-sm:  0 1px 3px rgba(43, 43, 43, 0.08), 0 1px 2px rgba(43, 43, 43, 0.04);\n  --shadow-md:  0 4px 12px rgba(43, 43, 43, 0.08), 0 2px 4px rgba(43, 43, 43, 0.04);\n  --shadow-lg:  0 12px 28px rgba(43, 43, 43, 0.10), 0 4px 10px rgba(43, 43, 43, 0.05);\n  --shadow-xl:  0 24px 56px rgba(43, 43, 43, 0.14), 0 8px 18px rgba(43, 43, 43, 0.06);\n\n  /* Brand-tinted glow (for green/blue emphasis) */\n  --shadow-brand: 0 8px 24px rgba(152, 196, 76, 0.25);\n  --shadow-focus: 0 0 0 3px rgba(76, 139, 165, 0.35);\n\n  /* Motion — gentle, no bounce; calm & reassuring */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1); /* @kind other */\n  --duration-fast:   120ms; /* @kind other */\n  --duration-normal: 200ms; /* @kind other */\n  --duration-slow:   320ms; /* @kind other */\n}\n\n/* ============================================================\n   Verbund Pflegehilfe — Base element styles & utilities\n   Minimal, opt-in resets layered on the token system.\n   ============================================================ */\n:root {\n  color-scheme: light;\n}\n\nbody.vp {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--type-body-size);\n  line-height: var(--type-body-leading);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Heading helpers (class-based; do not restyle bare tags globally) */\n.vp-display { font-size: var(--type-display-size); font-weight: var(--type-display-weight); line-height: var(--type-display-leading); letter-spacing: var(--tracking-tight); color: var(--text-strong); margin: 0; }\n.vp-h1 { font-size: var(--type-h1-size); font-weight: var(--type-h1-weight); line-height: var(--leading-tight); color: var(--text-strong); margin: 0; }\n.vp-h2 { font-size: var(--type-h2-size); font-weight: var(--type-h2-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-h3 { font-size: var(--type-h3-size); font-weight: var(--type-h3-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-h4 { font-size: var(--type-h4-size); font-weight: var(--type-h4-weight); line-height: var(--leading-snug); color: var(--text-strong); margin: 0; }\n.vp-body { font-size: var(--type-body-size); line-height: var(--type-body-leading); color: var(--text-body); }\n.vp-small { font-size: var(--type-small-size); color: var(--text-muted); }\n.vp-caption { font-size: var(--type-caption-size); color: var(--text-subtle); }\n.vp-overline { font-size: var(--type-overline-size); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }\n\n.vp-link { color: var(--text-link); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--duration-fast) var(--ease-standard); }\n.vp-link:hover { border-bottom-color: currentColor; }\n\n<\u002Fstyle>\n  <script src=\"a0cb3034-6585-41f9-8674-1a389ab618fd\"><\u002Fscript>\n  <style>\n    html,body{margin:0;background:#eef1ea;-webkit-text-size-adjust:100%}\n    *{box-sizing:border-box}\n play:block;font:700 15px var(--font-sans);color:var(--text-strong)\">Als CSV exportieren<\u002Fspan>\n                <span style=\"display:block;font:400 12px var(--font-sans);color:var(--text-muted);margin-top:2px\">Tabelle für Excel oder Numbers<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <button onclick=\"{{ exportJSON }}\" style=\"display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:12px;padding:14px 16px;cursor:pointer\">\n              <span style=\"width:38px;height:38px;border-radius:10px;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex:none\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"flex:1\">\n                <span style=\"display:block;font:700 15px var(--font-sans);color:var(--text-strong)\">Als JSON exportieren<\u002Fspan>\n                <span style=\"display:block;font:400 12px var(--font-sans);color:var(--text-muted);margin-top:2px\">Vollständige Sicherung aller Daten<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'woche',\n    detailId: null,\n    detailFrom: 'woche',\n    weekStart: null,\n    monthAnchor: null,\n    habits: [],\n    logs: {},\n    ready: false,\n    sheet: null,\n ,\n      openEditorNew: this.openEditorNew, editCurrent: this.editCurrent, askDelete: this.askDelete,\n      prevWeek: this.prevWeek, nextWeek: this.nextWeek, goToday: this.goToday,\n      stop: (e) => e.stopPropagation(),\n      closeSheet: this.closeSheet, closeEditor: this.closeEditor, closeConfirm: this.closeConfirm, doDelete: this.doDelete,\n      saveHabit: this.saveHabit,\n      toastOpen: !!S.toast, toastMsg: S.toast || '',\n      confirmOpen: S.confirmOpen,\n      editorOpen: S.editorOpen,\n    };\n    if (!S.ready) return base;\n\n    const today = this._today();\n    const ws = this.parse(S.weekStart);\n    const we = this.addDays(ws, 6);\n    const mAbbr = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];\n    const mFull = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];\n    const wdFull = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];\n    const wdShort = ['Mo','Di','Mi','Do','Fr','Sa','So'];\n    const tdReal = new Date();\n    base.todayLabel = `${wdFull[this.wd(tdReal)]}, ${tdReal.getDate()}. ${mFull[tdReal.getMonth()]}`;\n    base.weekLabel = (ws.getMonth() === we.getMonth())\n      ? `${ws.getDate()}.–${we.getDate()}. ${mAbbr[we.getMonth()]} ${we.getFullYear()}`\n      : `${ws.getDate()}. ${mAbbr[ws.getMonth()]} – ${we.getDate()}. ${mAbbr[we.getMonth()]}`;\n    base.kwLabel = 'KW ' + this.isoWeek(ws);\n\n    base.weekDays = [];\n    for (let i = 0; i < 7; i++) {\n      const d = this.addDays(ws, i);\n      const isToday = this.iso(d) === this.iso(today);\n      base.weekDays.push({\n        wd: wdShort[i], dom: String(d.getDate()),\n        headStyle: { textAlign: 'center', padding: '4px 0', borderRadius: '9px', color: isToday ? '#fff' : 'var(--text-muted)', background: isToday ? 'var(--vp-blue)' : 'transparent' },\n      });\n    }\n\n    // export summary (always available)\n    let _logCount = 0;\n    S.habits.forEach(h => { _logCount += Object.keys(S.logs[h.id] || {}).length; });\n    base.exportSummary = `${S.habits.length} Gewohnheiten · ${_logCount} erfasste Einträge`;\n\n    // month view\n    if (S.view === 'monat') {\n      base.monthWdLabels = wdShort;\n      const a = this.parse(S.monthAnchor);\n      const yr = a.getFullYear(), mo = a.getMonth();\n      base.monthLabel = `${mFull[mo]} ${yr}`;\n      const firstWd = this.wd(new Date(yr, mo, 1));\n      const dim = new Date(yr, mo + 1, 0).getDate();\n      const cells = [];\n      for (let b = 0; b < firstWd; b++) cells.push({ blank: true, dom: '', dots: [], onTap: null, numStyle: {}, style: { aspectRatio: '1 / 1' } });\n      for (let dd = 1; dd <= dim; dd++) {\n        const date = new Date(yr, mo, dd);\n        const key = this.iso(date);\n        const isToday = key === this.iso(today);\n        const future = date > today;\n        const dots = [];\n        S.habits.forEach(h => {\n          if (!h.days.includes(this.wd(date))) return;\n          const done = this.val(h.id, key) >= h.target;\n          dots.push({ width: '6px', height: '6px', borderRadius: '50%', background: done ? h.color : this.hexA(h.color, 0.20) });\n        });\n        cells.push({\n          blank: false,\n          dom: String(dd),\n          dots,\n          onTap: () => this.setState({ weekStart: this.iso(this.monday(date)), view: 'woche' }),\n          numStyle: { font: (isToday ? '900' : '600') + ' 12px var(--font-sans)', color: isToday ? '#fff' : (future ? 'var(--text-subtle)' : 'var(--text-body)') },\n          style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px', justifyContent: 'center', aspectRatio: '1 / 1', borderRadius: '9px', border: 'none', cursor: 'pointer', padding: '2px', background: isToday ? 'var(--vp-blue)' : 'transparent', WebkitTapHighlightColor: 'transparent' },\n        });\n      }\n      base.monthCells = cells;\n      base.monthLegend = S.habits.map(h => ({ name: h.name, dot: { width: '9px', height: '9px', borderRadius: '50%', background: h.color, flex: 'none' } }));\n      let md = 0, ms = 0;\n      for (let dd = 1; dd <= dim; dd++) { const date = new Date(yr, mo, dd); if (date > today) continue; S.habits.forEach(h => { if (h.days.includes(this.wd(date))) { ms++; if (this.val(h.id, this.iso(date)) >= h.target) md++; } }); }\n      base.monthSummary = ms ? `${md} von ${ms} geplanten Einträgen erledigt` : 'Noch keine geplanten Einträge';\n    }\n\n    base.hasHabits = S.habits.length > 0;\n    base.noHabits = S.habits.length === 0;\n\n    base.weekRows = S.habits.map(h => {\n      const cells = [];\n      let done = 0, sched = 0;\n      for (let i = 0; i < 7; i++) {\n        const d = this.addDays(ws, i);\n        cells.push(this.cellFor(h, d));\n        if (h.days.includes(this.wd(d))) { sched++; if (this.val(h.id, this.iso(d)) >= h.target) done++; }\n      }\n      const allDone = sched > 0 && done === sched;\n      return {\n        name: h.name,\n        sub: h.unit === 'count' ? `Ziel ${h.target}×/Tag` : `Ziel ${h.target} Min/Tag`,\n        dotStyle: { width: '11px', height: '11px', borderRadius: '50%', background: h.color, flex: 'none' },\n        weekTotalLabel: sched > 0 ? `${done}/${sched}` : '—',\n        badgeStyle: { font: '700 12px var(--font-sans)', padding: '4px 9px', borderRadius: '999px', flex: 'none', background: allDone ? 'var(--green-50)' : 'var(--neutral-100)', color: allDone ? 'var(--green-700)' : 'var(--text-muted)' },\n        cells,\n        onOpen: () => this.openDetail(h.id, 'woche'),\n      };\n    });\n\n    // dashboard\n    let bestStreak = 0, weekDone = 0, weekSched = 0;\n    S.habits.forEach(h => {\n      bestStreak = Math.max(bestStreak, this.streaks(h).longest);\n      for (let i = 0; i < 7; i++) { const d = this.addDays(this.monday(today), i); if (h.days.includes(this.wd(d))) { weekSched++; if (this.val(h.id, this.iso(d)) >= h.target) weekDone++; } }\n    });\n    base.kpiActive = String(S.habits.length);\n    base.kpiWeek = weekSched ? `${weekDone}/${weekSched}` : '0';\n    base.kpiBest = bestStreak + (bestStreak === 1 ? ' Tag' : ' Tage');\n\n    if (S.view === 'stats') {\n      base.summaries = S.habits.map(h => ({\n        name: h.name,\n        sub: (h.unit === 'count' ? 'Anzahl' : 'Dauer') + ` · Serie ${this.streaks(h).cur} ${this.streaks(h).cur === 1 ? 'Tag' : 'Tage'}`,\n        dotStyle: { width: '14px', height: '14px', borderRadius: '50%', background: h.color, flex: 'none' },\n        totalLabel: this.fmtTotal(h),\n        spark: this.sparkline(h),\n        onOpen: () => this.openDetail(h.id, 'stats'),\n      }));\n    }\n\n    // detail\n    if (S.view === 'detail') {\n      const h = S.habits.find(x => x.id === S.detailId);\n      if (h) {\n        const st = this.streaks(h);\n        base.dh = {\n          name: h.name,\n          bigDotStyle: { width: '20px', height: '20px', borderRadius: '7px', background: h.color, flex: 'none' },\n          targetLabel: (h.unit === 'count' ? 'Anzahl' : 'Dauer') + ' · Ziel ' + (h.unit === 'count' ? `${h.target}× pro Tag` : `${h.target} Min pro Tag`),\n          totalCaption: 'Gesamt',\n          chartCaption: h.unit === 'count' ? 'Erledigte Einträge' : 'Investierte Zeit',\n          totalLabel: this.fmtTotal(h),\n          weeklyLabel: this.fmtWeekly(h),\n          streakLabel: st.cur + (st.cur === 1 ? ' Tag' : ' Tage'),\n          longestLabel: st.longest + (st.longest === 1 ? ' Tag' : ' Tage'),\n          daysChips: wdShort.map((l, i) => ({\n            label: l,\n            style: { font: '700 12px var(--font-sans)', padding: '5px 10px', borderRadius: '999px', background: h.days.includes(i) ? this.hexA(h.color, 0.16) : 'var(--neutral-100)', color: h.days.includes(i) ? 'var(--text-strong)' : 'var(--text-subtle)' },\n          })),\n        };\n        base.detailChart = this.areaChart(h);\n        base.detailHeatmap = this.heatmap(h);\n      }\n    }\n\n    // quick-log sheet\n    base.sheetOpen = !!S.sheet;\n    if (S.sheet) {\n      const h = this.sheetHabit();\n      if (h) {\n        const d = this.parse(S.sheet.key);\n        const v = this.val(h.id, S.sheet.key);\n        const isDur = h.unit === 'duration';\n        base.sheetTitle = h.name;\n        base.sheetSub = `${wdFull[this.wd(d)]}, ${d.getDate()}. ${mAbbr[d.getMonth()]} · Ziel ${h.target} ${isDur ? 'Min' : 'Mal'}`;\n        base.sheetValue = String(v);\n        base.sheetUnit = isDur ? 'Minuten' : 'Mal';\n        base.sheetDotStyle = { width: '12px', height: '12px', borderRadius: '50%', background: h.color, flex: 'none' };\n        base.isDurationSheet = isDur;\n        base.sheetInc = () => this.sheetAdd(isDur ? 5 : 1);\n        base.sheetDec = () => this.sheetAdd(isDur ? -5 : -1);\n        base.sheetReset = () => this.setVal(h.id, S.sheet.key, 0);\n        base.sheetDone = () => { this.setVal(h.id, S.sheet.key, h.target); this.setState({ sheet: null }); this.toast('Eintrag gespeichert'); };\n        base.presets = [15, 30, 45, 60].map(p => ({\n          label: String(p),\n          onClick: () => this.setVal(h.id, S.sheet.key, p),\n          style: { minWidth: '46px', height: '36px', padding: '0 12px', borderRadius: '999px', border: '1.5px solid ' + (v === p ? h.color : 'var(--border-default)'), background: v === p ? this.hexA(h.color, 0.14) : 'var(--surface-card)', color: v === p ? 'var(--text-strong)' : 'var(--text-body)', font: '700 13px var(--font-sans)', cursor: 'pointer' },\n        }));\n      }\n    }\n\n    // editor\n    const dr = S.draft;\n    const isCount = dr.unit === 'count';\n    base.editorTitle = S.editingId ? 'Gewohnheit bearbeiten' : 'Neue Gewohnheit';\n    base.dName = dr.name;\n    base.dTarget = dr.target;\n    base.onName = (e) => this.setDraft({ name: e.target.value });\n    base.onTarget = (e) => { const raw = e.target.value; this.setDraft({ target: raw === '' ? '' : Math.max(0, parseInt(raw, 10) || 0) }); };\n    base.setCount = () => this.setDraft({ unit: 'count', target: isCount ? dr.target : 1 });\n    base.setDur = () => this.setDraft({ unit: 'duration', target: !isCount ? dr.target : 30 });\n    const seg = (active) => ({ flex: 1, height: '36px', borderRadius: '999px', border: 'none', cursor: 'pointer', font: '700 14px var(--font-sans)', background: active ? 'var(--vp-green)' : 'transparent', color: active ? '#fff' : 'var(--text-muted)' });\n    base.countSeg = seg(isCount);\n    base.durSeg = seg(!isCount);\n    base.targetFieldLabel = isCount ? 'Ziel pro Tag (Anzahl)' : 'Ziel pro Tag (Minuten)';\n    base.palette = ['#98c44c','#4c8ba5','#f2a288','#bd7632','#335d6e','#5f822e'].map(c => ({\n      onPick: () => this.setDraft({ color: c }),\n      style: { width: '30px', height: '30px', borderRadius: '50%', background: c, border: 'none', cursor: 'pointer', flex: 'none', boxShadow: dr.color === c ? `inset 0 0 0 3px #fff, 0 0 0 2px ${c}` : 'none' },\n    }));\n    base.draftDays = wdShort.map((l, i) => ({\n      label: l,\n      onToggle: () => { const days = dr.days.includes(i) ? dr.days.filter(x => x !== i) : [...dr.days, i]; this.setDraft({ days }); },\n      style: { flex: 1, height: '38px', borderRadius: '10px', cursor: 'pointer', font: '700 13px var(--font-sans)', border: '1.5px solid ' + (dr.days.includes(i) ? 'var(--green-500)' : 'var(--border-subtle)'), background: dr.days.includes(i) ? 'var(--green-50)' : 'var(--surface-card)', color: dr.days.includes(i) ? 'var(--green-700)' : 'var(--text-subtle)' },\n    }));\n    base.saveDisabled = !(dr.name.trim() && parseInt(dr.target, 10) > 0);\n    base.confirmName = (S.habits.find(x => x.id === S.detailId) || {}).name || '';\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
